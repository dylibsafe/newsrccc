name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rabis/theos:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Theos
        run: |
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git /opt/theos
          fi

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v3
        with:
          name: com.m7md.tweak
          path: packages/*.deb
