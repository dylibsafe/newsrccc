name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Dependencies & Theos
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make dpkg git curl unzip
          if [ -d "/opt/theos" ]; then
            sudo rm -rf /opt/theos
          fi
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          
          # SDK-nı birbaşa temp kimi çəkib düzgün yerə qoyuruq ki, struktur pozulmasın
          sudo rm -rf /opt/theos/sdks
          sudo mkdir -p /opt/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          cp -R /tmp/sdks/* /opt/theos/sdks/
          
          sudo chmod -R 777 /opt/theos

      - name: Build Tweak
        run: |
          export THEOS=/opt/theos
          export PATH="$THEOS/bin:$PATH"
          make clean
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.m7md.tweak
          path: packages/*.deb
