name: Build Tweak

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Theos
        uses: theos/action@v1

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: com.m7md.tweak
          path: packages/*.deb
