name: Build M7MD Dylib

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Manuel çalıştırma butonu

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid (İmzalama Aracı)
        run: |
          curl -LO https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macosx_arm64
          chmod +x ldid_macosx_arm64
          mkdir -p $THEOS/bin
          mv ldid_macosx_arm64 $THEOS/bin/ldid
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build Dylib Only
        run: |
          make clean
          make all

      - name: Find Dylib and Upload
        uses: actions/upload-artifact@v4
        with:
          name: M7MD-Dylib
          # Theos derleme sonrası dylib dosyasını .theos/obj/ klasörüne çıkarır
          path: .theos/obj/M7MD.dylib
          if-no-files-found: error
